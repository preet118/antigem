name: Build Complete AntiGem Ubuntu 24 ARM64
on:
  workflow_dispatch:
  push:
    branches:
      - feature/ubuntu-full-workspace
    paths:
      - .github/workflows/build-preconfigured-ubuntu.yml
      - scripts/provision_full_ubuntu.sh
      - scripts/verify_full_ubuntu.sh

permissions:
  contents: write

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate provisioning scripts
        run: |
          bash -n scripts/provision_full_ubuntu.sh
          bash -n scripts/verify_full_ubuntu.sh
      - name: Download and prepare Ubuntu 24.04 ARM64 base
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-arm64.tar.gz -o /tmp/ubuntu-base.tar.gz
          sudo mkdir -p /tmp/antigem-ubuntu-root
          sudo tar -xzf /tmp/ubuntu-base.tar.gz -C /tmp/antigem-ubuntu-root
          sudo chmod 1777 /tmp/antigem-ubuntu-root/tmp
          printf 'nameserver 1.1.1.1\n' | sudo tee /tmp/antigem-ubuntu-root/etc/resolv.conf
          for n in null random urandom tty; do sudo cp -a "/dev/$n" "/tmp/antigem-ubuntu-root/dev/$n"; done
          sudo cp scripts/provision_full_ubuntu.sh /tmp/antigem-ubuntu-root/tmp/provision_full_ubuntu.sh
          sudo cp scripts/verify_full_ubuntu.sh /tmp/antigem-ubuntu-root/tmp/verify_full_ubuntu.sh
      - name: Install full languages, agents and skill skeleton
        shell: bash
        run: |
          set -euo pipefail
          sudo chroot /tmp/antigem-ubuntu-root /usr/bin/env HOME=/root USER=root DEBIAN_FRONTEND=noninteractive /bin/bash /tmp/provision_full_ubuntu.sh
      - name: Strict CLI smoke tests and package inventory
        shell: bash
        run: |
          set -euo pipefail
          sudo chroot /tmp/antigem-ubuntu-root /usr/bin/env HOME=/root USER=root /bin/bash /tmp/verify_full_ubuntu.sh
          sudo chroot /tmp/antigem-ubuntu-root /usr/bin/dpkg-query -W > package-inventory.tsv
          sudo chroot /tmp/antigem-ubuntu-root /usr/bin/env HOME=/root /usr/local/bin/node --version > runtime-versions.txt
          sudo chroot /tmp/antigem-ubuntu-root /usr/bin/env HOME=/root /root/.local/bin/agy --version >> runtime-versions.txt
          sudo chroot /tmp/antigem-ubuntu-root /usr/bin/env HOME=/root /usr/local/bin/claude --version >> runtime-versions.txt
          wc -l package-inventory.tsv
      - name: Sanitize and compress preconfigured rootfs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/antigem-ubuntu-root
          sudo rm -f "$ROOT/dev/null" "$ROOT/dev/random" "$ROOT/dev/urandom" "$ROOT/dev/tty" "$ROOT/etc/resolv.conf"
          sudo rm -f "$ROOT/tmp/provision_full_ubuntu.sh" "$ROOT/tmp/verify_full_ubuntu.sh"
          sudo find "$ROOT" -type s -delete
          sudo tar -C "$ROOT" -czf /tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz .
          (cd /tmp && sha256sum AntiGem-Ubuntu24-ARM64-Full.tar.gz) | tee /tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz.sha256
          stat -c 'ROOTFS_ARCHIVE_BYTES=%s' /tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz
          sudo du -sh "$ROOT"
      - name: Upload complete rootfs candidate, checksums and package inventory
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Ubuntu24-ARM64-Full-CANDIDATE
          path: |
            /tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz
            /tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz.sha256
            package-inventory.tsv
            runtime-versions.txt
          retention-days: 30
          if-no-files-found: error
      - name: Publish pre-release for controlled on-device tests
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=antigem-ubuntu24-full-v1
          args=(/tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz /tmp/AntiGem-Ubuntu24-ARM64-Full.tar.gz.sha256 package-inventory.tsv runtime-versions.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${args[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${args[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AntiGem Full Ubuntu ARM64 — Android testing required" --notes "Full language toolchain and AGY/Claude CLIs; chroot smoke-tested only. Android PRoot, MCP, agent login and subagents require hardware verification. No user credentials bundled." --prerelease
          fi
