
name: Build AntiGem Standard APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - fix/ubuntu-26-claude-antigravity
  push:
    branches:
      - fix/ubuntu-26-claude-antigravity
      - feature/ubuntu-full-workspace

permissions:
  # The called rootfs job publishes the tested image+APK as a prerelease.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agy_ide_bridge/go.mod

      - name: Install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Ubuntu tooling scripts
        run: |
          bash -n scripts/provision_full_ubuntu.sh
          bash -n scripts/verify_full_ubuntu.sh
      - name: Build APK (#34 Full Ubuntu candidate for new branch)
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "$GITHUB_REF" = "refs/heads/feature/ubuntu-full-workspace" ] || [ "${GITHUB_HEAD_REF:-}" = "feature/ubuntu-full-workspace" ]; then
            ./gradlew :app:assembleFullDebug --no-daemon --stacktrace
          else
            ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p output
          if [ "$GITHUB_REF" = "refs/heads/feature/ubuntu-full-workspace" ] || [ "${GITHUB_HEAD_REF:-}" = "feature/ubuntu-full-workspace" ]; then
            cp app/build/outputs/apk/full/debug/*.apk output/AntiGem-Full-Ubuntu-34.apk
          else
            cp app/build/outputs/apk/standard/debug/*.apk output/AntiGem-Standard.apk
          fi
          cp app/src/main/assets/bin/agy_ide_bridge output/
          sha256sum output/*

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Full-Ubuntu-34-APK
          path: output/*
          if-no-files-found: error

  # One manual launch of the existing #33 workflow on the full branch can build
  # the independent APK, then build and publish the matching ARM64 rootfs.
  full-ubuntu-rootfs:
    if: github.ref == 'refs/heads/feature/ubuntu-full-workspace' || github.head_ref == 'feature/ubuntu-full-workspace'
    needs: build
    uses: ./.github/workflows/build-preconfigured-ubuntu.yml
    permissions:
      contents: write
