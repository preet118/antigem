
name: Build AntiGem Standard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agy_ide_bridge/go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Standard Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace

      - name: Prepare files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/debug/*.apk dist/
          cp app/src/main/assets/bin/agy_ide_bridge dist/
          ls -lh dist/
          sha256sum dist/*

      - name: Upload APK and Bridge
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 7
