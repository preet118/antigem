
name: Build AntiGem Standard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agy_ide_bridge/go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/standard/debug/*.apk output/AntiGem-Standard.apk
          cp app/src/main/assets/bin/agy_ide_bridge output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-Standard-Android
          path: output/*
          if-no-files-found: error
